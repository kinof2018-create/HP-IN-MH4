    width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:20px;

  .nav-brand .tt{display:flex;flex-direction:column;line-height:1.15;}
  .nav-brand .tt b{font-size:15px;font-weight:800;letter-spacing:-0.01em;}
  .nav-brand .tt span{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.75);letter-spacing:0.03em;}

  .nav-tabs{display:flex;gap:8px;margin-left:6px;}
  .tab{
    appearance:none;border:1px solid rgba(255,255,255,0.20);cursor:pointer;
    display:flex;align-items:center;gap:8px;
    padding:9px 18px;border-radius:9999px;
    background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.82);
    font:700 13.5px/1 var(--font);letter-spacing:-0.01em;
    transition:background .18s, color .18s, border-color .18s, transform .12s;
    white-space:nowrap;
  }
  .tab .ic{font-size:15px;}
  .tab:hover{background:rgba(255,255,255,0.14);color:#fff;}
  .tab.active{background:#fff;color:var(--blue-500);border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.22);}
  .tab.active:hover{background:#fff;}

  .nav-hint{margin-left:auto;color:rgba(255,255,255,0.62);font:600 11.5px/1.3 var(--font);
    display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .nav-hint .live{width:8px;height:8px;border-radius:50%;background:#2DC07A;box-shadow:0 0 0 3px rgba(45,192,122,0.25);}

  /* ── 화면(프레임) 영역 ── */
  .stage{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;background:#F4F5F8;}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent;}
  .frame.active{display:block;}

  /* 최초 로딩 표시 */
  .booting{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#5A5F6E;font:600 14px/1.5 var(--font);background:#F4F5F8;
  }
  .booting.hidden{display:none;}

  @media (max-width:720px){
    :root{--nav-h:104px;}
    .navbar{flex-wrap:wrap;align-content:center;gap:10px 14px;padding:8px 14px;}
    .nav-hint{display:none;}
    .nav-tabs{width:100%;margin-left:0;}
    .tab{flex:1;justify-content:center;padding:9px 10px;font-size:12.5px;}
  }
</style>
</head>

<style>
:root{
  /* Samsung Blue */
  --color-primary-300:#4D67C3;
  --color-primary-400:#2645B0;
  --color-primary-500:#1428A0;
  --color-primary-600:#0F1E78;
  --color-primary-700:#0A1758;

  --color-secondary-500:#2AA39B;

  /* Semantic (라이트 톤) */
  --success-bg:#E4F7EC; --success-fg:#0E9F5E;
  --warning-bg:#FFF3DE; --warning-fg:#B5730A;
  --error-bg:#FDE7EC;   --error-fg:#D6294B;
  --info-bg:#E6EFFF;    --info-fg:#1B63D6;

  /* Surface (밝은 캔버스) */
  --bg-base:#F4F5F8;
  --bg-subtle:#EEF0F5;
  --bg-elevated:#FFFFFF;

  /* Text (진한 글자 = 높은 대비) */
  --text-primary:#0A0A0F;
  --text-secondary:#2A2E3A;
  --text-tertiary:#5A5F6E;

  --border-default:#E1E4EC;
  --border-subtle:#EDEFF4;
  --border-strong:#C4C9D6;

  --radius-md:8px; --radius-lg:12px; --radius-xl:20px; --radius-full:9999px;

  --shadow-sm:0 1px 2px rgba(16,24,40,0.06);
  --shadow-md:0 6px 18px rgba(16,24,40,0.08);
  --shadow-card:0 14px 28px rgba(20,40,160,0.18);

  --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px;

  --font:SamsungOne,'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}

/* 루트 글자 크기: 기본 16px → 21px (약 30% 확대). 모든 rem 이 비례 확대됨 */
html{ font-size:21px; }

/* ── 다크 모드 (토글로 활성화 · 기본은 라이트) ── */
body.dark{
  --success-bg:#0F2A1A; --success-fg:#2DC07A;
  --warning-bg:#2A2010; --warning-fg:#FFB84F;
  --error-bg:#2A0F18;   --error-fg:#FF4D6D;
  --info-bg:#0F1A3A;    --info-fg:#4FA0FF;
  --bg-base:#17171D; --bg-subtle:#1E1E27; --bg-elevated:#27272F;
  --text-primary:#FFFFFF; --text-secondary:rgba(255,255,255,0.85); --text-tertiary:rgba(255,255,255,0.66);
  --border-default:rgba(255,255,255,0.12); --border-subtle:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.24);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4); --shadow-md:0 8px 20px rgba(0,0,0,0.45); --shadow-card:0 14px 28px rgba(0,0,0,0.55);
}
body.dark{ background:radial-gradient(1200px 600px at 12% -10%, rgba(20,40,160,0.30), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(42,163,155,0.14), transparent 55%), var(--bg-base); }
body.dark .modal-head .cnt{background:rgba(0,0,0,0.25);}
body.dark .oi-card{background:var(--bg-subtle);}
body.dark .oi-memo textarea{background:var(--bg-base);color:var(--text-primary);}
body.dark .input:focus{background:var(--bg-subtle);}
body.dark tbody tr.flag{background:#33280F;}
body.dark tbody tr.flag:hover{background:#3E3113;}
body.dark .tag-self{background:rgba(255,255,255,0.10);color:var(--text-secondary);}
body.dark .loader.drag{background:#1E2740;}
body.dark .sel{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23AAB2C8' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");}
body.dark .sel option{background:#27272F;color:#fff;}
/* 라이트/다크 토글 버튼 */
.theme-btn{cursor:pointer;font-size:0.6875rem;font-weight:700;padding:7px 12px;border-radius:var(--radius-full);
  background:var(--bg-elevated);color:var(--text-tertiary);border:1px solid var(--border-default);box-shadow:var(--shadow-sm);
  display:inline-flex;align-items:center;gap:7px;}
.theme-btn:hover{border-color:var(--border-strong);color:var(--text-secondary);}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(20,40,160,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(42,163,155,0.08), transparent 55%),
    var(--bg-base);
  color:var(--text-primary);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 64px;}

/* ── Header ────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .logo{
  width:46px;height:46px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--color-primary-600),var(--color-primary-500));
  box-shadow:var(--shadow-card);
  display:grid;place-items:center;font-size:1.375rem;
}
.brand h1{margin:0;font-size:1.375rem;font-weight:700;letter-spacing:-0.01em;line-height:1.15;}
.brand .sub{font-size:0.75rem;font-weight:600;color:var(--text-tertiary);margin-top:3px;letter-spacing:0.02em;}

.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.status-chip{
  font-size:0.6875rem;font-weight:700;letter-spacing:0.02em;
  padding:7px 12px;border-radius:var(--radius-full);
  background:var(--bg-elevated);color:var(--text-tertiary);
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-default);
  box-shadow:var(--shadow-sm);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-tertiary);}
.dot.live{background:var(--success-fg);box-shadow:0 0 0 3px rgba(14,159,94,0.18);}
.dot.err{background:var(--error-fg);box-shadow:0 0 0 3px rgba(214,41,75,0.18);}

.sel{
  background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-default);
  border-radius:var(--radius-full);padding:9px 14px;font:600 0.75rem/1 var(--font);cursor:pointer;
  appearance:none;-webkit-appearance:none;box-shadow:var(--shadow-sm);
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235A5F6E' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:30px;
}
.sel:hover{border-color:var(--border-strong);}
.sel:focus{outline:none;border-color:var(--color-primary-400);}
.btn{
  background:var(--color-primary-500);color:#fff;border:0;
  border-radius:var(--radius-full);padding:9px 16px;font:600 0.75rem/1 var(--font);cursor:pointer;
  transition:background .2s;
}
.btn:hover{background:var(--color-primary-400);}

/* ── File loader (file:// mode) ───────────── */
.loader{
  display:none;margin-bottom:24px;padding:22px;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:var(--bg-elevated);text-align:center;box-shadow:var(--shadow-sm);
}
.loader.show{display:block;}
.loader.drag{border-color:var(--color-primary-400);background:#EEF2FF;}
.loader h3{margin:0 0 6px;font-size:1rem;font-weight:700;color:var(--text-primary);}
.loader p{margin:0 0 14px;font-size:0.8125rem;color:var(--text-tertiary);}
.btn-pay{background:var(--color-primary-500);color:#fff;font-weight:700;padding:12px 24px;border-radius:var(--radius-full);border:0;cursor:pointer;font-size:0.875rem;box-shadow:var(--shadow-card);}
.btn-pay:hover{background:var(--color-primary-400);}

/* ── Alert ────────────────────────────────── */
.alert{
  display:none;margin-bottom:24px;padding:16px 18px;border-radius:var(--radius-lg);
  background:var(--warning-bg);color:var(--warning-fg);border:1px solid #F0D28A;
  font-size:0.875rem;font-weight:600;
}
.alert.show{display:block;}

/* ── KPI cards ────────────────────────────── */
.kpi-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;
}
.kpi{
  background:var(--bg-elevated);border:1px solid var(--border-default);
  border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.kpi::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:var(--color-primary-500);opacity:.9;
}
.kpi.accent-warn::before{background:var(--warning-fg);}
.kpi.accent-info::before{background:var(--info-fg);}
.kpi.accent-teal::before{background:var(--color-secondary-500);}
.kpi .label{font-size:0.6875rem;font-weight:700;letter-spacing:0.04em;color:var(--text-tertiary);text-transform:uppercase;}
.kpi .val{font-size:1.75rem;font-weight:800;margin-top:10px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text-primary);}
.kpi .foot{font-size:0.6875rem;font-weight:600;color:var(--text-tertiary);margin-top:6px;}
.kpi .foot b{color:var(--warning-fg);font-weight:800;}

/* ── 클릭 가능한 미완료 카드 ── */
.kpi-clickable{cursor:pointer;transition:transform .12s, box-shadow .12s;}
.kpi-clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);}
.kpi-clickable::after{
  content:"클릭 ▸";position:absolute;top:12px;right:14px;
  font-size:0.5625rem;font-weight:700;color:var(--warning-fg);
  background:var(--warning-bg);padding:3px 8px;border-radius:var(--radius-full);opacity:.9;
}

/* ── 미완료 상세 모달 ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(16,24,40,0.45);backdrop-filter:blur(2px);
}
.modal-overlay.show{display:block;}
.modal{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:var(--bg-elevated);border-radius:var(--radius-xl);
  width:760px;max-width:calc(100vw - 32px);
  height:640px;max-height:calc(100vh - 80px);min-width:340px;min-height:240px;
  box-shadow:0 24px 60px rgba(16,24,40,0.30);
  border:1px solid var(--border-default);overflow:hidden;
  display:flex;flex-direction:column;
  resize:both;               /* 우측 하단 모서리로 크기 조절 */
}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:20px 24px;
  border-bottom:1px solid var(--border-default);background:var(--warning-bg);
  cursor:move;user-select:none;flex:none;    /* 헤더를 잡고 이동 */
}
.modal-head h2{margin:0;font-size:1.125rem;font-weight:800;color:var(--warning-fg);}
.modal-head .cnt{font-size:0.75rem;font-weight:700;color:var(--warning-fg);background:#fff;padding:4px 10px;border-radius:var(--radius-full);}
.modal-head .drag-hint{font-size:0.625rem;font-weight:600;color:var(--warning-fg);opacity:.7;margin-left:4px;}
.modal-close{margin-left:auto;background:transparent;border:0;font-size:1.25rem;cursor:pointer;color:var(--text-tertiary);line-height:1;padding:4px 8px;border-radius:8px;}
.modal-close:hover{background:rgba(0,0,0,0.06);color:var(--text-primary);}
.modal-body{padding:16px 24px 24px;overflow-y:auto;flex:1 1 auto;}
/* 리사이즈 손잡이 시각 표시 */
.modal::-webkit-resizer{background:transparent;}
.resize-badge{
  position:absolute;right:6px;bottom:4px;font-size:0.625rem;color:var(--text-tertiary);
  pointer-events:none;opacity:.7;
}

.oi-card{
  border:1px solid var(--border-default);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:14px;background:#FFFDF8;
}
.oi-card:last-child{margin-bottom:0;}
.oi-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.oi-top .oi-target{font-size:0.9375rem;font-weight:800;color:var(--text-primary);}
.oi-top .oi-mgmt{font-size:0.6875rem;font-weight:700;color:var(--text-tertiary);background:var(--bg-subtle);padding:3px 8px;border-radius:var(--radius-full);}
.oi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;margin-bottom:14px;}
.oi-field{font-size:0.8125rem;line-height:1.5;}
.oi-field .k{color:var(--text-tertiary);font-weight:600;margin-right:6px;}
.oi-field .v{color:var(--text-secondary);font-weight:600;}
.oi-memo label{display:block;font-size:0.75rem;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.oi-memo textarea{
  width:100%;box-sizing:border-box;min-height:60px;resize:vertical;
  border:1px solid var(--border-default);border-radius:var(--radius-md);
  padding:10px 12px;font:400 0.8125rem/1.5 var(--font);color:var(--text-primary);background:#fff;
}
.oi-memo textarea:focus{outline:none;border-color:var(--color-primary-400);}
.oi-memo .saved{font-size:0.6875rem;color:var(--success-fg);font-weight:700;margin-top:4px;height:14px;}
.modal-empty{padding:32px;text-align:center;color:var(--text-tertiary);font-size:0.875rem;}

@media (max-width:560px){
  .oi-grid{grid-template-columns:1fr;}
}

/* ── Chart grid ───────────────────────────── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.panel{
  background:var(--bg-elevated);border:1px solid var(--border-default);
  border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-md);
}
.panel h2{margin:0 0 4px;font-size:1.0625rem;font-weight:800;letter-spacing:-0.005em;color:var(--text-primary);}
.panel .q{font-size:0.75rem;color:var(--text-tertiary);margin:0 0 16px;font-weight:500;}
.chart-box{position:relative;height:320px;}

/* ── Table ────────────────────────────────── */
.table-panel{margin-top:16px;}
.table-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.input{
  background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-full);
  padding:10px 16px;color:var(--text-primary);font:400 0.8125rem/1.3 var(--font);flex:1;min-width:180px;
  box-shadow:var(--shadow-sm);
}
.input::placeholder{color:var(--text-tertiary);}
.input:focus{outline:none;border-color:var(--color-primary-400);background:#fff;}

.tbl-scroll{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border-default);}
table{width:100%;border-collapse:collapse;font-size:0.7812rem;min-width:900px;background:var(--bg-elevated);}
thead th{
  position:sticky;top:0;background:var(--bg-subtle);color:var(--text-secondary);
  font-weight:700;text-align:left;padding:12px 14px;white-space:nowrap;
  border-bottom:2px solid var(--border-default);font-size:0.7188rem;letter-spacing:0.02em;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap;}
tbody tr:hover{background:var(--bg-subtle);}
tbody tr.flag{background:#FFF6E4;}
tbody tr.flag:hover{background:#FFEFCE;}
td.num{font-variant-numeric:tabular-nums;text-align:right;}

.tag{padding:4px 10px;border-radius:var(--radius-full);font:700 0.6875rem/1.4 var(--font);letter-spacing:0.02em;display:inline-block;}
.tag-done{background:var(--success-bg);color:var(--success-fg);}
.tag-temp{background:var(--warning-bg);color:var(--warning-fg);}

.empty{padding:40px;text-align:center;color:var(--text-tertiary);font-size:0.8125rem;}
.foot-note{margin-top:24px;font-size:0.6875rem;color:var(--text-tertiary);text-align:center;line-height:1.7;}
.foot-note code{background:var(--bg-subtle);border:1px solid var(--border-default);border-radius:4px;padding:1px 6px;color:var(--text-secondary);}

@media (max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
}
@media (max-width:560px){
  html{ font-size:19px; }
  .kpi-grid{grid-template-columns:1fr;}
  .wrap{padding:20px 14px 48px;}
}

<script>
/* ═══════════════════════════════════════════
   데이터 경로 (상대경로 고정 — 전체 URL 금지)
═══════════════════════════════════════════ */
const DATA_URL = './data.xlsx';
const REFRESH_MS = 60000;
const isFile = location.protocol==='file:';

/* ── 팔레트 ── */
const PALETTE = ['#1428A0','#E8710A','#0E9F6E','#D6294B','#7C3AED','#0EA5E9','#F59E0B','#14B8A6','#DB2777','#64748B'];
let GRID = 'rgba(16,24,40,0.08)';
let TICK = '#3A3F4D';
let LEGEND = '#2A2E3A';
Chart.defaults.font.family = "SamsungOne, Pretendard, sans-serif";
Chart.defaults.font.size = 14;           // 기본 13→14 (약 30% 확대 반영)
Chart.defaults.color = TICK;

let RAW = [];            // 정규화된 전체 행
let charts = {};         // Chart 인스턴스
let refreshTimer = null;

/* ═══════════════ 유틸 ═══════════════ */
const $ = id => document.getElementById(id);
const won = n => '₩' + Math.round(n||0).toLocaleString('ko-KR');

function parseCost(v){
  if(v==null) return 0;
  if(typeof v === 'number') return v;
  const n = String(v).replace(/[₩,\s]/g,'').replace(/[^\d.-]/g,'');
  return n === '' ? 0 : (parseFloat(n)||0);
}
// 날짜: "26/2/3", "2026-02-03", Excel serial 등 → {ym:'2026-02', label:'26/02', d:Date}
function parseDate(v){
  if(v==null||v==='') return null;
  // Excel serial number
  if(typeof v === 'number' && v > 1000){
    const d = new Date(Math.round((v-25569)*86400*1000));
    return buildDate(d);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{2,4})[.\/\-\s]+(\d{1,2})[.\/\-\s]+(\d{1,2})/);
  if(m){
    let y = parseInt(m[1],10); if(y<100) y += 2000;
    return buildDate(new Date(y, parseInt(m[2],10)-1, parseInt(m[3],10)));
  }
  const d = new Date(s);
  return isNaN(d) ? null : buildDate(d);
}
function buildDate(d){
  const y=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0');
  return { ym:`${y}-${mo}`, label:`${String(y).slice(2)}/${mo}`, d };
}
// 표·모달의 "일자" 표시용 문자열.
// 엑셀 날짜 서식 셀은 raw:true 로 읽으면 일련번호(예: 46000)로 들어오므로,
// 그런 경우 실제 날짜(YYYY-MM-DD)로 변환해 보여준다. 이미 사람이 읽을 수 있는
// 날짜 문자열(예: "26/2/3", "2026-02-03")이면 원본 그대로 유지한다.
function displayDate(r){
  const raw = (r.dateRaw==null ? '' : String(r.dateRaw)).trim();
  if(!raw) return '–';
  const isSerial = /^\d+(\.\d+)?$/.test(raw);   // 순수 숫자 = 엑셀 일련번호로 판단
  if(isSerial && r.dateObj){
    const d = r.dateObj;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return raw;
}
// 헤더명 유연 매핑
function pick(row, keys){
  for(const k of Object.keys(row)){
    const clean = String(k).replace(/\s/g,'');
    for(const want of keys){ if(clean.includes(want)) return row[k]; }
  }
  return '';
}

/* ═══════════════ 정규화 ═══════════════ */
// 원본 헤더에 '구분'이 2개 등장(① 설비/장비/시설, ② 고장교체/수리/부품교체/보수).
// SheetJS는 중복 헤더를 '구분', '구분_1' 로 자동 구분한다.
// 정확한 헤더 키를 찾아 kind(자산유형) / taskType(작업유형)을 구분해 매핑한다.
function findKindKeys(sampleRow){
  const keys = Object.keys(sampleRow).filter(k=>String(k).replace(/\s/g,'').includes('구분'));
  return keys; // [kindKey, taskTypeKey?] 순서대로
}
function normalize(rows){
  const kindKeys = rows.length ? findKindKeys(rows[0]) : [];
  const kindKey = kindKeys[0] || '구분';
  const taskKey = kindKeys[1] || null;   // 두 번째 '구분' = 작업유형

  return rows.map(r=>{
    const dateRaw = pick(r,['일자','날짜','date','Date']);
    const dt = parseDate(dateRaw);
    const vendor = String(pick(r,['수행업체','업체']) || '').trim();
    const isOut = vendor.includes('외주');
    const kind = String(r[kindKey] || '').trim();
    let taskType = taskKey ? String(r[taskKey] || '').trim() : '';
    if(!taskType){ // 폴백: 조치내용/현상에서 유형 추론
      const a = String(pick(r,['조치내용','조치'])||'');
      if(a.includes('교체')) taskType='부품교체';
      else if(a.includes('수리')) taskType='고장수리';
      else if(a.includes('보수')) taskType='부분보수';
      else taskType='기타';
    }
    return {
      dateRaw: dateRaw==null?'':String(dateRaw),
      ym: dt?dt.ym:'', monthLabel: dt?dt.label:'', dateObj: dt?dt.d:null,
      kind,                                   // 설비/장비/시설
      zone: String(pick(r,['구역']) || '').trim(),
      target: String(pick(r,['대상설비명','설비명','대상']) || '').trim(),
      mgmt: String(pick(r,['관리번호']) || '').trim(),
      taskType,                               // 고장교체/수리/부품교체/보수
      symptom: String(pick(r,['발생현상','현상','문제']) || '').trim(),
      cause: String(pick(r,['원인']) || '').trim(),
      action: String(pick(r,['조치내용','조치']) || '').trim(),
      cost: parseCost(pick(r,['소요비용','비용','금액'])),
      vendor: vendor || '자체처리',
      isOut,
      worker: String(pick(r,['작업자']) || '').trim(),
      status: String(pick(r,['진행상태','상태']) || '').trim(),
      note: String(pick(r,['비고']) || '').trim(),
    };
  }).filter(r=> r.target || r.zone || r.symptom);  // 빈 행 제거
}

/* ═══════════════ 필터 ═══════════════ */
function getFiltered(){
  const m=$('filterMonth').value, z=$('filterZone').value,
        s=$('filterStatus').value, v=$('filterVendor').value,
        q=($('search').value||'').trim().toLowerCase();
  return RAW.filter(r=>{
    if(m && r.ym!==m) return false;
    if(z && r.zone!==z) return false;
    if(s && r.status!==s) return false;
    if(v && r.vendor!==v) return false;
    if(q){
      const hay=[r.target,r.symptom,r.cause,r.action,r.worker,r.zone,r.taskType].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ═══════════════ 필터 옵션 채우기 ═══════════════ */
function fillFilters(){
  const uniq=(arr)=>[...new Set(arr.filter(Boolean))];
  const setOpts=(id,vals,keep)=>{
    const el=$(id), cur=el.value;
    el.innerHTML=`<option value="">${keep}</option>`+vals.map(v=>`<option value="${v}">${v}</option>`).join('');
    if(vals.includes(cur)) el.value=cur;
  };
  setOpts('filterMonth', uniq(RAW.map(r=>r.ym)).sort().map(ym=>ym), '전체 기간');
  // month label
  $('filterMonth').querySelectorAll('option').forEach(o=>{
    if(o.value){ const r=RAW.find(x=>x.ym===o.value); if(r) o.textContent=r.monthLabel; }
  });
  setOpts('filterZone', uniq(RAW.map(r=>r.zone)).sort(), '전체 구역');
  setOpts('filterStatus', uniq(RAW.map(r=>r.status)).sort(), '전체 상태');
  setOpts('filterVendor', uniq(RAW.map(r=>r.vendor)).sort(), '전체 처리주체');
}

/* ═══════════════ KPI ═══════════════ */
function renderKPI(rows){
  const count=rows.length;
  const total=rows.reduce((s,r)=>s+r.cost,0);
  const avg=count?total/count:0;
  const open=rows.filter(r=>r.status && r.status!=='완료').length;
  const outCost=rows.filter(r=>r.isOut).reduce((s,r)=>s+r.cost,0);
  const outPct=total?(outCost/total*100):0;
  const selfCount=rows.filter(r=>!r.isOut).length;

  $('kpiCount').textContent=count.toLocaleString('ko-KR')+'건';
  $('kpiCountFoot').textContent=`자체 ${selfCount} · 외주 ${count-selfCount}`;
  $('kpiCost').textContent=won(total);
  $('kpiAvg').textContent=won(avg);
  $('kpiOpen').innerHTML = open>0 ? `${open}건` : '0건';
  $('kpiOpenFoot').innerHTML = open>0 ? `<b>확인 필요</b>` : '전건 완료';
  $('kpiOut').textContent=outPct.toFixed(0)+'%';
  $('kpiOutFoot').textContent=`외주 ${won(outCost)}`;
}

/* ═══════════════ 차트 ═══════════════ */
function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }
let noGridX={grid:{display:false},ticks:{color:TICK,font:{size:14}}};
let gridY={grid:{color:GRID},ticks:{color:TICK,font:{size:14}}};
// 현재 테마(라이트/다크)에 맞춰 차트 색을 갱신
function applyChartTheme(){
  const d=document.body.classList.contains('dark');
  GRID   = d?'rgba(255,255,255,0.10)':'rgba(16,24,40,0.08)';
  TICK   = d?'rgba(255,255,255,0.70)':'#3A3F4D';
  LEGEND = d?'rgba(255,255,255,0.85)':'#2A2E3A';
  Chart.defaults.color = TICK;
  noGridX={grid:{display:false},ticks:{color:TICK,font:{size:14}}};
  gridY={grid:{color:GRID},ticks:{color:TICK,font:{size:14}}};
}

function groupSum(rows, key, valFn){
  const m={};
  rows.forEach(r=>{const k=r[key]||'기타'; m[k]=(m[k]||0)+valFn(r);});
  return m;
}
function groupCount(rows, key){
  const m={};
  rows.forEach(r=>{const k=r[key]||'기타'; m[k]=(m[k]||0)+1;});
  return m;
}

function renderCharts(rows){
  destroyCharts();
  applyChartTheme();

  /* 구역별 비용 (가로 막대) */
  {
    const m=groupSum(rows,'zone',r=>r.cost);
    const ent=Object.entries(m).sort((a,b)=>b[1]-a[1]);
    charts.zone=new Chart($('chartZone'),{
      type:'bar',
      data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>e[1]),
        backgroundColor:ent.map((e,i)=>PALETTE[i%PALETTE.length]),hoverBackgroundColor:ent.map((e,i)=>PALETTE[i%PALETTE.length]),borderRadius:6,barThickness:'flex',maxBarThickness:26}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>won(c.parsed.x)}}},
        scales:{x:{...gridY,ticks:{color:TICK,font:{size:13},callback:v=>'₩'+(v/1000)+'k'}},y:noGridX}}
    });
  }

  /* 구분별 건수 (도넛) */
  {

  {

        {type:'line',label:'비용',data:keys.map(k=>byMonth[k].cost),

          tension:0.35,fill:true,pointBackgroundColor:'#FFB84F',pointRadius:4,yAxisID:'y1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:LEGEND,font:{size:14},usePointStyle:true,boxWidth:10}},
          tooltip:{callbacks:{label:c=>c.dataset.label==='비용'?`비용: ${won(c.parsed.y)}`:`건수: ${c.parsed.y}건`}}},
        scales:{x:noGridX,
          y:{position:'left',...gridY,title:{display:true,text:'건수',color:TICK,font:{size:13}},beginAtZero:true,ticks:{stepSize:1,color:TICK,font:{size:13}}},
          y1:{position:'right',grid:{display:false},ticks:{color:TICK,font:{size:13},callback:v=>'₩'+(v/1000)+'k'},beginAtZero:true}}}
    });
  }

  /* 원인 TOP 5 (가로 막대) */
  {
    const m=groupCount(rows,'cause');
    const ent=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
    charts.cause=new Chart($('chartCause'),{
      type:'bar',
      data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>e[1]),
        backgroundColor:['#1428A0','#2645B0','#4D67C3','#8093D5','#B3BFE7'],borderRadius:6,maxBarThickness:26}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.x}건`}}},
        scales:{x:{...gridY,beginAtZero:true,ticks:{stepSize:1,color:TICK,font:{size:13}}},y:{...noGridX,ticks:{color:TICK,font:{size:13.5}}}}}
    });
  }
}

/* ═══════════════ 워크북 파싱 (공용) ═══════════════ */
// 헤더로 볼 만한 필수 컬럼 키워드
const HEADER_HINTS = ['일자','구역','대상','설비','소요','비용','원인','발생','현상','진행','상태','구분','관리'];

// 시트를 2차원 배열로 읽어, 헤더가 몇 번째 행인지 자동 탐색
function detectHeaderRow(aoa){
  const scan = Math.min(aoa.length, 15); // 상위 15행만 검사
  let best = {idx:-1, score:0};
  for(let i=0;i<scan;i++){
    const cells = (aoa[i]||[]).map(c=>String(c==null?'':c).replace(/\s/g,''));
    const nonEmpty = cells.filter(c=>c!=='').length;
    if(nonEmpty < 3) continue; // 셀이 너무 적은 행(제목행 등)은 헤더 아님
    let score = 0;
    cells.forEach(c=>{ if(HEADER_HINTS.some(h=>c.includes(h))) score++; });
    if(score > best.score) best = {idx:i, score};
  }
  return best.score >= 2 ? best.idx : 0; // 힌트가 2개 이상 맞으면 그 행, 아니면 첫 행
}

// 한 시트에서 (헤더행 탐색 → 객체배열) 변환
function sheetToRows(ws){
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
  if(!aoa.length) return {rows:[], headerIdx:-1};
  const headerIdx = detectHeaderRow(aoa);
  // 중복 헤더('구분' 2개)에 접미사를 붙여 고유화 (SheetJS 기본과 동일 규칙)
  const seen = {};
  const header = (aoa[headerIdx]||[]).map((h,ci)=>{
    let name = String(h==null?'':h).trim() || `열${ci+1}`;
    if(seen[name]!=null){ seen[name]++; name = `${name}_${seen[name]}`; }
    else seen[name] = 0;
    return name;
  });
  const rows = [];
  for(let r=headerIdx+1; r<aoa.length; r++){
    const arr = aoa[r]||[];
    if(arr.every(c=>String(c==null?'':c).trim()==='')) continue; // 빈 행 skip
    const obj = {};
    header.forEach((h,ci)=>{ obj[h] = arr[ci]!=null ? arr[ci] : ''; });
    rows.push(obj);
  }
  return {rows, headerIdx};
}

// 데이터가 들어있는 시트를 자동 선택 (첫 시트가 표지/빈 시트인 경우 대비)
function pickBestSheet(wb){
  let best = {name:null, rows:[], headerIdx:-1, count:0};
  for(const name of wb.SheetNames){
    const {rows, headerIdx} = sheetToRows(wb.Sheets[name]);
    // 필수 컬럼(일자 또는 대상설비명)이 실제로 잡히는지 확인
    const usable = rows.filter(r=> pick(r,['일자','날짜']) || pick(r,['대상설비명','설비명','대상']) || pick(r,['구역']));
    if(usable.length > best.count){ best = {name, rows, headerIdx, count:usable.length}; }
  }
  return best;
}

function handleWorkbook(wb){
  if(!wb.SheetNames.length){ showAlert('엑셀에 시트가 없습니다.'); return; }

  const best = pickBestSheet(wb);

  // 진단: 어떤 시트도 유효 데이터가 없을 때
  if(best.count === 0){
    const keysSample = best.rows.length ? Object.keys(best.rows[0]).slice(0,8).join(', ') : '(빈 시트)';
    showAlert(
      `파일은 읽었지만 표에서 인식 가능한 열을 찾지 못했습니다. ` +
      `헤더에 '일자 · 구역 · 대상설비명 · 소요비용' 같은 항목이 있는지 확인해 주세요. ` +
      `(감지된 시트: "${best.name||wb.SheetNames[0]}", 인식된 첫 행 열 이름: ${keysSample})`
    );
    return;
  }

  RAW = normalize(best.rows);

  if(RAW.length === 0){
    showAlert('행은 있으나 유효한 데이터가 없습니다. 대상설비명·구역·발생현상 중 하나 이상이 채워진 행이 필요합니다.');
    return;
  }

  hideAlert();
  fillFilters();
  renderAll();
  // file 모드에서 데이터가 뜨면 로더 접기
  if(isFile){ $('loader').classList.remove('show'); }
}

/* isFile 은 파일 상단(DATA_URL 근처)에서 이미 선언됨 */

async function fetchData(){
  try{
    const url=DATA_URL+'?t='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    handleWorkbook(wb);
    setStatus('live','실시간 · '+new Date().toLocaleTimeString('ko-KR'));
  }catch(err){
    setStatus('err','로드 실패');
    showAlert(`data.xlsx 를 불러오지 못했습니다 (${err.message}). 같은 폴더에 data.xlsx 가 있는지, 서버 경로가 올바른지 확인하세요.`);

/* ── 파일 자동 감시(실시간 연동) 상태 ── */
let fileHandle = null;        // File System Access API 핸들
let watchTimer = null;        // 감시 인터벌
let lastModified = 0;         // 마지막으로 읽은 파일의 수정 시각
const WATCH_MS = 3000;        // 3초마다 파일 변경 확인
const supportsFSAccess = ('showOpenFilePicker' in window);

function initFileMode(){
  $('loader').classList.add('show');
  setStatus('','파일 지정 대기');
  const loader=$('loader'), input=$('fileInput');

  // 자동 연동 버튼: File System Access API 지원 시에만 동작
  const watchBtn=$('watchBtn');
  if(supportsFSAccess){
    watchBtn.onclick=startWatching;
  }else{
    // 미지원 브라우저: 자동 연동 버튼 숨기고 안내 문구 조정
    watchBtn.style.display='none';
    $('loaderDesc').innerHTML='아래 "파일 선택"으로 data.xlsx 를 불러오세요. 데이터를 바꾼 뒤에는 다시 선택하면 갱신됩니다.<br>(실시간 자동 연동은 Chrome 또는 Edge 브라우저에서 지원됩니다.)';
  }

  // 수동 1회 선택 (기존 방식 유지)
  $('pickBtn').onclick=()=>input.click();
  input.onchange=e=>{ if(e.target.files[0]) readFile(e.target.files[0]); };

  // 드래그&드롭 (기존 방식 유지)
  ['dragenter','dragover'].forEach(ev=>loader.addEventListener(ev,e=>{e.preventDefault();loader.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>loader.addEventListener(ev,e=>{e.preventDefault();loader.classList.remove('drag');}));
  loader.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f); });
}

/* File System Access API로 파일을 지정하고 주기적으로 변경 감시 */
async function startWatching(){
  try{
    const [handle]=await window.showOpenFilePicker({
      types:[{description:'Excel', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],'application/vnd.ms-excel':['.xls']}}],
      multiple:false
    });
    fileHandle=handle;
    lastModified=0;
    await readFromHandle(true);        // 첫 로드
    if(watchTimer) clearInterval(watchTimer);
    watchTimer=setInterval(()=>readFromHandle(false), WATCH_MS);  // 이후 자동 감시
  }catch(err){
    if(err && err.name==='AbortError') return;  // 사용자가 취소한 경우 조용히 종료
    setStatus('err','연동 실패'); showAlert('파일 연동에 실패했습니다: '+(err&&err.message||err));
  }
}

/* 핸들에서 파일을 읽되, 수정 시각이 바뀐 경우에만 다시 렌더링 */
async function readFromHandle(force){
  if(!fileHandle) return;
  try{
    const file=await fileHandle.getFile();
    if(!force && file.lastModified===lastModified) return; // 변경 없으면 skip
    lastModified=file.lastModified;
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    handleWorkbook(wb);
    setStatus('live','자동 연동 · '+new Date().toLocaleTimeString('ko-KR'));
  }catch(err){
    // 권한이 만료되면 재요청 필요할 수 있음
    setStatus('err','읽기 실패');
    showAlert('파일을 다시 읽지 못했습니다. "실시간 자동 연동 시작"을 다시 눌러 파일을 지정해 주세요. ('+(err&&err.message||err)+')');
    if(watchTimer){ clearInterval(watchTimer); watchTimer=null; }
  }
}

/* 수동 1회 선택 (기존 FileReader 방식) */
function readFile(file){
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      handleWorkbook(wb);
      setStatus('live','파일: '+file.name);
    }catch(err){ setStatus('err','파싱 실패'); showAlert('파일을 읽을 수 없습니다: '+err.message); }
  };
  rd.onerror=()=>{ setStatus('err','읽기 실패'); showAlert('파일 읽기에 실패했습니다.'); };
  rd.readAsArrayBuffer(file);
}

/* ═══════════════ 미완료 상세 모달 + 메모 ═══════════════ */
const MEMO_PREFIX = 'facility_memo_';   // localStorage 키 접두사

// 메모 키: 관리번호 우선, 없으면 구역+설비명 조합
function memoKey(r){
  const base = (r.mgmt && r.mgmt.trim()) ? r.mgmt.trim() : (r.zone+'|'+r.target);
  return MEMO_PREFIX + base;
}
function loadMemo(r){
  try{ return localStorage.getItem(memoKey(r)) || ''; }catch(e){ return ''; }
}
function saveMemo(r, text){
  try{ localStorage.setItem(memoKey(r), text); return true; }catch(e){ return false; }
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 현재 필터가 적용된 데이터에서 미완료 항목만 추려 모달에 렌더링

          <div class="oi-field"><span class="k">구역</span><span class="v">${esc(r.zone)||'–'}</span></div>
          <div class="oi-field"><span class="k">발생현상</span><span class="v">${esc(r.symptom)||'–'}</span></div>
          <div class="oi-field"><span class="k">원인</span><span class="v">${esc(r.cause)||'–'}</span></div>
          <div class="oi-field"><span class="k">조치내용</span><span class="v">${esc(r.action)||'–'}</span></div>
          <div class="oi-field"><span class="k">작업자</span><span class="v">${esc(r.worker)||'–'}</span></div>
          <div class="oi-field"><span class="k">처리주체</span><span class="v">${esc(r.vendor)||'–'}</span></div>
          <div class="oi-field"><span class="k">소요비용</span><span class="v">${r.cost?won(r.cost):'–'}</span></div>
          ${r.note ? `<div class="oi-field" style="grid-column:1/-1"><span class="k">비고</span><span class="v">${esc(r.note)}</span></div>` : ''}
        </div>
        <div class="oi-memo">
          <label for="memo_${i}">📝 중요사항 메모 (이 브라우저에 저장됩니다)</label>
          <textarea id="memo_${i}" data-idx="${i}" placeholder="예: 부품 발주 완료, 담당자 통화 예정, 재점검 필요 등">${esc(memo)}</textarea>
          <div class="saved" id="saved_${i}"></div>
        </div>
      </div>`;
    }).join('');

    // 메모 자동 저장 (입력 후 0.6초)
    let memoTimers = {};
    body.querySelectorAll('textarea[data-idx]').forEach(ta=>{
      const idx = ta.getAttribute('data-idx');
      ta.addEventListener('input', ()=>{
        clearTimeout(memoTimers[idx]);
        memoTimers[idx] = setTimeout(()=>{
          const ok = saveMemo(sorted[idx], ta.value);
          const savedEl = $('saved_'+idx);
          if(savedEl){
            savedEl.textContent = ok ? '✓ 저장됨 · '+new Date().toLocaleTimeString('ko-KR') : '저장 실패(브라우저 설정 확인)';
            if(ok) setTimeout(()=>{ if(savedEl) savedEl.textContent=''; }, 2500);
          }
        }, 600);
      });
    });

  const box=$('openModalBox');

  $('openModal').classList.add('show');
}

/* ── 모달 드래그 이동 ── */
(function enableModalDrag(){
  const box = $('openModalBox'), head = $('openModalHead');
  if(!box || !head) return;
  let dragging=false, offX=0, offY=0;

  function onDown(e){
    // 닫기 버튼을 누른 경우는 드래그 아님
    if(e.target.closest('.modal-close')) return;
    dragging=true;
    const pt = e.touches ? e.touches[0] : e;
    const rect = box.getBoundingClientRect();
    // transform(가운데 정렬) 제거하고 실제 좌표로 고정
    box.style.transform='none';
    box.style.left = rect.left + 'px';
    box.style.top  = rect.top  + 'px';
    offX = pt.clientX - rect.left;
    offY = pt.clientY - rect.top;
    document.body.style.userSelect='none';
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    let x = pt.clientX - offX;
    let y = pt.clientY - offY;
    // 화면 밖으로 완전히 나가지 않도록 살짝 제한
    const w = box.offsetWidth, h = box.offsetHeight;
    const margin = 40;
    x = Math.max(margin - w + 80, Math.min(x, window.innerWidth - 80));
    y = Math.max(0, Math.min(y, window.innerHeight - 44));
    box.style.left = x + 'px';
    box.style.top  = y + 'px';
  }
  function onUp(){ dragging=false; document.body.style.userSelect=''; }

  head.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  head.addEventListener('touchstart', onDown, {passive:false});
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('touchend', onUp);
})();

// 카드 클릭 → 모달 열기
$('kpiOpenCard').addEventListener('click', openOpenModal);
// 닫기 (X 버튼, 배경 클릭, ESC)
$('modalClose').addEventListener('click', closeOpenModal);
$('openModal').addEventListener('click', e=>{ if(e.target===$('openModal')) closeOpenModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOpenModal(); });

/* ═══════════════ 이벤트 ═══════════════ */
['filterMonth','filterZone','filterStatus','filterVendor'].forEach(id=>$(id).addEventListener('change',renderAll));
let searchTimer;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(renderAll,200);});
/* 라이트/다크 토글 */
$('themeBtn').addEventListener('click',()=>{

/* ═══════════════ 시작 ═══════════════ */
if(isFile){

<script>
let RAW, KPI, YEARLY, FULL;
const charts = {};

const fmt = n => n===null||n===undefined ? '-' : Math.round(n).toLocaleString('ko-KR');
const fmtUSD = n => n===null||n===undefined ? '-' : '$'+Math.round(n).toLocaleString('en-US');

document.getElementById('asOfDate').textContent = '2026-07-13';

/* ================================================================
   선적서류(PDF 등) 연결 — GitHub 저장소의 DOC 폴더를 자동 조회
   - 저장소 구조 예) DOC/SHD_WHV24/INVOICE_....pdf , BL_....pdf , 수출신고필증.pdf
   - 아래 저장소 정보(GH_OWNER/GH_REPO/GH_BRANCH/DOC_BASE)만 맞으면,
     각 폴더의 실제 파일을 자동으로 찾아 상세표 배지로 연결합니다.
     (파일 이름이 제각각이어도 이름 속 키워드로 PO·INV·BL·면장·세금을 자동 분류)
   - 새 LOT 서류는 DOC/<INVOICE번호> 폴더를 만들어 파일을 넣기만 하면 자동 인식됩니다.
     폴더명은 INVOICE번호의 공백·구분자를 무시하고 매칭하므로
     SHD_WHV24 / SHD-WHV24 / SHDWHV24 어느 형태여도 됩니다.
   ================================================================ */
const GH_OWNER  = 'kinof2018-create';   // GitHub 사용자/조직명
const GH_REPO   = 'HP-IN-MH4';          // 저장소 이름
const GH_BRANCH = 'main';               // 브랜치
const DOC_BASE  = 'DOC';                // index.html 옆의 서류 최상위 폴더명

// 서류 종류(엑셀 선적서류 칸과 동일 순서) + 파일명 자동분류 규칙
const DOC_TYPES = [
  {key:'po',      label:'PO',   test:/(발주|purchase|(^|[^a-z])p\.?o([^a-z]|$))/i},
  {key:'invoice', label:'INV',  test:/(invoice|인보이스|(^|[^a-z])inv([^a-z]|$))/i},
  {key:'bl',      label:'BL',   test:/(선하증권|b\s*\/\s*l|(^|[^a-z])bl([^a-z]|$))/i},
  {key:'export',  label:'면장', test:/(수출|export|신고필증|면장)/i},   // 수출면장(수출신고필증)
  {key:'tax',     label:'세금', test:/(세금|계산서|tax)/i},            // 세금계산서
];

// INVOICE번호/폴더명을 구분자·공백 무시하고 비교하기 위한 정규화 : "SHD - WHV24" → "SHDWHV24"
function docKey(s){ return String(s==null?'':s).toUpperCase().replace(/[\s_\-]/g,''); }
function classifyDoc(name){
  for(const t of DOC_TYPES){ if(t.test.test(name)) return t; }
  return {key:'etc', label:'📄'};
}

// GitHub API로 DOC 폴더의 실제 파일 목록을 한 번 읽어 인덱스 생성
let DOC_INDEX = null;   // { 정규화키: [ {type,label,path}, ... ] }
async function loadDocIndex(){
  const api = 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/trees/'+GH_BRANCH+'?recursive=1';
  const idx = {};
  try{
    const res = await fetch(api, {headers:{'Accept':'application/vnd.github+json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    (data.tree||[]).forEach(function(node){
      if(node.type!=='blob') return;
      const p = node.path || '';
      const parts = p.split('/');
      if(parts.length < 3) return;
      if(parts[0].toUpperCase() !== DOC_BASE.toUpperCase()) return;   // DOC/ 하위만
      const file = parts[parts.length-1];
      if(!/\.(pdf|png|jpe?g|gif|webp|hwp|hwpx|docx?|xlsx?|tiff?)$/i.test(file)) return;
      const t = classifyDoc(file);
      const key = docKey(parts[1]);
      (idx[key] = idx[key] || []).push({type:t.key, label:t.label, path:p});
    });
    DOC_INDEX = idx;
  }catch(err){
    console.warn('선적서류 목록을 불러오지 못했습니다:', err && err.message);
    DOC_INDEX = {};   // 실패해도 표는 정상 동작
  }
  renderTable();      // 인덱스 반영해 배지 다시 그림
}

// 한 행(LOT)의 선적서류 배지들 생성
function docCell(inv){
  const key = docKey(inv);
  if(DOC_INDEX === null){   // 아직 목록 로딩 전
    return '<span class="doc-cell">'+DOC_TYPES.map(function(t){return '<span class="doc-badge off" title="불러오는 중…">'+t.label+'</span>';}).join('')+'</span>';
  }
  const files = DOC_INDEX[key] || [];
  const byType = {}; const extras = [];
  files.forEach(function(f){
    if(f.type==='etc'){ extras.push(f); }
    else if(!byType[f.type]){ byType[f.type]=f; }
  });
  const badges = DOC_TYPES.map(function(t){
    const f = byType[t.key];
    if(f){
      const href = encodeURI(f.path);   // DOC/<폴더>/<파일> (index.html 기준 상대경로)
      return '<a class="doc-badge on" href="'+href+'" target="_blank" rel="noopener" title="'+t.label+' 열기 (새 탭)">'+t.label+'</a>';
    }
    return '<span class="doc-badge off" title="미등록">'+t.label+'</span>';
  });
  extras.forEach(function(f){
    const nm = f.path.split('/').pop().replace(/"/g,'');
    badges.push('<a class="doc-badge on" href="'+encodeURI(f.path)+'" target="_blank" rel="noopener" title="'+nm+'">📄</a>');
  });
  return '<span class="doc-cell">'+badges.join('')+'</span>';
}

/* ================================================================
   화면 렌더링 (최초 로드 + 엑셀 재연동 시 공통으로 재사용)
   ================================================================ */
function renderAll(){
  document.getElementById('dateRange').textContent = (KPI.first_date||'-') + ' ~ ' + (KPI.last_date||'-');
  document.getElementById('lotCount').textContent = KPI.lot_count;

  const kpiCards = [
    {label:'누적 발주량', icon:'📦', value:fmt(KPI.po_cum_final), unit:'EA', bar:'var(--color-primary-500)',
      foot:`입고이행률 ${KPI.fulfill_rate}%`, footClass:'tag-up', progress:KPI.fulfill_rate},
    {label:'누적 입고량', icon:'🚚', value:fmt(KPI.in_cum_final), unit:'EA', bar:'var(--color-info-fg)',
      foot:`발주 대비 ${KPI.fulfill_rate}%`, footClass:'tag-up', progress:KPI.fulfill_rate},
    {label:'누적 출하량', icon:'✈️', value:fmt(KPI.ship_cum_final), unit:'EA', bar:'var(--color-secondary-500)',
      foot:`입고 대비 ${KPI.ship_rate}%`, footClass:'tag-up', progress:KPI.ship_rate},
    {label:'현재 재고량', icon:'🏭', value:fmt(KPI.stock_final), unit:'EA', bar:'var(--color-warning-fg)',
      foot:'입고 - 출하 = 현재고', footClass:'tag-flat', progress:null},
    {label:'누적 매출액(환산)', icon:'💹', value:fmt(KPI.sell_total), unit:'원', bar:'var(--color-primary-400)',
      foot:`누적 매입액 ${fmt(KPI.buy_total)}원`, footClass:'tag-flat', progress:null},
    {label:'누적 수익금액', icon:'💰', value:fmt(KPI.profit_total), unit:'원', bar:'var(--color-success-fg)',
      foot:`평균 수익률 ${KPI.profit_rate_avg}%`, footClass:'tag-up', progress:KPI.profit_rate_avg},
    {label:'미수 잔액', icon:'⏳', value:fmt(KPI.ar_remain), unit:'USD', bar:'var(--color-error-fg)',
      foot:`회수율 ${KPI.collect_rate}%  (청구 $${fmt(KPI.ar_total)})`, footClass:'tag-down', progress:KPI.collect_rate},
    {label:'발주대비 생산부족량', icon:'✅', value:fmt(KPI.shortage), unit:'EA', bar:'var(--color-success-fg)',
      foot: KPI.shortage===0 ? '지연 없음 · 정상' : '부족 발생', footClass: KPI.shortage===0?'tag-up':'tag-down', progress:null},
  ];
  document.getElementById('kpiGrid').innerHTML = kpiCards.map(k=>`
    <div class="kpi-card">
      <div class="bar" style="background:${k.bar}"></div>
      <div class="top"><span class="label">${k.label}</span><span class="icon">${k.icon}</span></div>
      <div><span class="value">${k.value}</span><span class="unit">${k.unit}</span></div>
      <div class="foot ${k.footClass}">${k.foot}</div>
      ${k.progress!==null ? `<div class="progress"><i style="width:${Math.min(k.progress,100)}%"></i></div>` : ''}
    </div>
  `).join('');

  const recentPayments = FULL
    .filter(r=>r.wire_date && r.wire_amt)
    .sort((a,b)=> a.wire_date < b.wire_date ? 1 : -1)
    .slice(0,3);
  document.getElementById('arSummaryBody').innerHTML = `
    <div class="ar-total-box">
      <div class="lbl">최종 미수금 합계</div>
      <div class="val">${fmtUSD(KPI.ar_remain)}</div>
      <div class="sub">총 청구 ${fmtUSD(KPI.ar_total)} 중 입금 ${fmtUSD(KPI.wire_total)} · 회수율 ${KPI.collect_rate}%</div>
    </div>
    <div class="recent-pay-title">최근 입금 현황 3건</div>
    <div class="recent-pay-list">
      ${recentPayments.map(p=>`
        <div class="recent-pay-row">
          <span class="d">${p.wire_date}</span>
          <span class="a">+${fmtUSD(p.wire_amt)}</span>
        </div>
      `).join('') || '<div class="recent-pay-row"><span class="d">입금 내역 없음</span></div>'}
    </div>
  `;
  document.getElementById('donutLegend').innerHTML = `
    <div class="row"><span><span class="legend-dot" style="background:#2DC07A"></span>회수 완료</span><b>${fmtUSD(KPI.wire_total)}</b></div>
    <div class="row" style="border-top:1px solid var(--border-subtle);padding-top:8px;"><span>회수율</span><b style="color:#2DC07A;font-size:15px;">${KPI.collect_rate}%</b></div>
  `;

  populateYearFilter();
  renderTable();
  renderCharts();
}

/* ---------------- TABLE (입출고·미수금 상세 조회) ---------------- */
const yearSel = document.getElementById('yearFilter');
function populateYearFilter(){
  const cur = yearSel.value;
  [...yearSel.querySelectorAll('option')].forEach((o,i)=>{ if(i>0) o.remove(); });
  [...new Set(FULL.map(r=>r.year))].sort().reverse().forEach(y=>{
    const o = document.createElement('option'); o.value=y; o.textContent=y+'년'; yearSel.appendChild(o);
  });
  if([...yearSel.options].some(o=>o.value===cur)) yearSel.value = cur;
}

function renderTable(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const yr = yearSel.value;
  const st = document.getElementById('statusFilter').value;
  const dFrom = document.getElementById('dateFrom').value;
  const dTo = document.getElementById('dateTo').value;
  const rows = FULL.filter(r=>{
    if(yr && r.year!==yr) return false;
    if(st && r.status!==st) return false;
    if(q && !( (r.ship_lot||'').toLowerCase().includes(q) || (r.inv_no||'').toLowerCase().includes(q) )) return false;
    if(dFrom && (!r.ship_date || r.ship_date < dFrom)) return false;
    if(dTo && (!r.ship_date || r.ship_date > dTo)) return false;
    return true;
  });
  document.getElementById('rowCount').textContent = rows.length;
  document.getElementById('tableBody').innerHTML = rows.map(r=>`
    <tr>

function syncTopScroll(){
  // 고정 헤더영역(검색/필터+상단 가로스크롤바) 높이를 재어, 컬럼헤더가 그 아래에 붙도록 오프셋 설정
  const sec=document.getElementById('detailSection');
  const frozen=document.getElementById('detailFrozen');
  if(sec&&frozen){ sec.style.setProperty('--frozen-h', Math.round(frozen.getBoundingClientRect().height)+'px'); }
  const top=document.getElementById('tblTopScroll');
  const inner=document.getElementById('tblTopScrollInner');
  const scroll=document.querySelector('.table-scroll');
  if(!top||!inner||!scroll) return;
  const tbl=scroll.querySelector('table');
  inner.style.width=((tbl?tbl.scrollWidth:scroll.scrollWidth))+'px';
}
(function(){
  const top=document.getElementById('tblTopScroll');
  const scroll=document.querySelector('.table-scroll');
  if(top&&scroll){
    let lock=false;
    top.addEventListener('scroll',function(){ if(lock)return; lock=true; scroll.scrollLeft=top.scrollLeft; lock=false; });
    scroll.addEventListener('scroll',function(){ if(lock)return; lock=true; top.scrollLeft=scroll.scrollLeft; lock=false; });
    window.addEventListener('resize', syncTopScroll);
  }
})();

/* ================================================================
   엑셀 실시간 연동 - 같은 폴더의 원본 엑셀을 브라우저에서 직접 읽어
   KPI/차트/조회표를 다시 계산한다. 서버 없이 파일 하나로 동작해야
   하므로 File System Access API(Chrome/Edge)로 파일을 "연결"해 두면
   20초 주기로 자동 재조회하고, 미지원 브라우저는 수동 재선택으로 동작한다.
   ================================================================ */
function excelSerialToISO(v){
  if(v===null||v===undefined||v==='') return null;
  if(v instanceof Date){
    if(isNaN(v.getTime())) return null;
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v==='number'){
    try{
      const d = XLSX.SSF.parse_date_code(v);
      if(d && d.y) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
    }catch(e){}
    return null;
  }
  if(typeof v==='string'){
    const t = Date.parse(v);
    if(!isNaN(t)){
      const dd = new Date(t);
      return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    }
    return null;
  }
  return null;
}

const HPPK_COLS = ["no","po_date","po_qty","po_cum","in_date","in_lot","in_qty","in_cum","in_paid",
  "ship_date","load_date","ship_type","ship_lot","inv_no","ship_qty","ship_cum",
  "doc_po","doc_inv","doc_bl","doc_export","doc_taxinv","stock_cum",
  "buy_price_krw","buy_qty","buy_amt","buy_cum","sell_price_usd","fx_base","conv_amt","sell_qty","sell_amt","sell_cum",
  "profit_rate","profit_amt","profit_cum","ar_total_usd",
  "wire_date","wire_amt","wire_fx_base","wire_fx_conv","fx_gain_loss",
  "ar_remain_sum","ar_remain_cum","shortage_sum","shortage_cum","note"];

function buildYearlyJS(rows){
  const yearly = {};
  function bucket(y){ if(!yearly[y]) yearly[y]={po_qty:0,in_qty:0,ship_qty:0,buy_amt:0,sell_amt:0,profit_amt:0,ar_usd:0,wire_usd:0}; return yearly[y]; }
  rows.forEach(function(r){
    if(r.po_date && r.po_qty) bucket(r.po_date.slice(0,4)).po_qty += r.po_qty;
    if(r.in_date && r.in_qty) bucket(r.in_date.slice(0,4)).in_qty += r.in_qty;
    if(r.ship_date){
      const y=r.ship_date.slice(0,4), b=bucket(y);
      if(r.ship_qty) b.ship_qty += r.ship_qty;
      if(r.buy_amt) b.buy_amt += r.buy_amt;
      if(r.sell_amt) b.sell_amt += r.sell_amt;
      if(r.profit_amt) b.profit_amt += r.profit_amt;
      if(r.ar_total_usd) b.ar_usd += r.ar_total_usd;
    }
    if(r.wire_date && r.wire_amt) bucket(r.wire_date.slice(0,4)).wire_usd += r.wire_amt;
  });
  const out = {};
  Object.keys(yearly).sort().forEach(function(k){ out[k]=yearly[k]; });
  return out;
}

function buildFullTableJS(rows){
  const lots = rows.filter(function(r){ return !!r.ship_lot; });
  lots.sort(function(a,b){ return (a.ship_date||'') < (b.ship_date||'') ? 1 : -1; });
  return lots.map(function(r){
    const ar_open = Math.round(((r.ar_total_usd||0) - (r.wire_amt||0))*10)/10;
    return {
      no:r.no, year:(r.ship_date||'0000').slice(0,4),
      ship_lot:r.ship_lot, inv_no:r.inv_no, in_lot:r.in_lot,
      ship_date:r.ship_date, load_date:r.load_date,
      ship_qty:r.ship_qty, stock_cum:r.stock_cum,
      buy_price:r.buy_price_krw, buy_amt:r.buy_amt,
      sell_price_usd:r.sell_price_usd, fx_base:r.fx_base,
      sell_amt:r.sell_amt!=null? Math.round(r.sell_amt):null,
      profit_rate:r.profit_rate!=null? Math.round(r.profit_rate*1000)/10:null,
      profit_amt:r.profit_amt!=null? Math.round(r.profit_amt):null,
      ar_total_usd:r.ar_total_usd, wire_date:r.wire_date, wire_amt:r.wire_amt,
      fx_gain_loss:r.fx_gain_loss!=null? Math.round(r.fx_gain_loss):null,
      ar_open:ar_open,
      status: ar_open<=0 ? '완료' : '미수'
    };
  });
}

function buildKPIJS(summary, fxSeries, lotCount, firstDate, lastDate){
  const po_cum_final=summary.po_cum, in_cum_final=summary.in_cum, ship_cum_final=summary.ship_cum, stock_final=summary.stock_cum;
  const fulfill_rate = po_cum_final? Math.round((in_cum_final/po_cum_final*100)*10)/10 : 0;
  const ship_rate = in_cum_final? Math.round((ship_cum_final/in_cum_final*100)*10)/10 : 0;
  const buy_total=summary.buy_cum, sell_total=summary.sell_cum, profit_total=summary.profit_cum;
  const profit_rate_avg = summary.profit_rate!=null? Math.round(summary.profit_rate*100*100)/100 : 0;
  const ar_total=summary.ar_total_usd, wire_total=summary.wire_amt, ar_remain=summary.ar_remain_cum;
  const collect_rate = ar_total? Math.round((wire_total/ar_total*100)*10)/10 : 0;
  const shortage = summary.shortage_cum;
  const latest_fx = fxSeries.length? fxSeries[fxSeries.length-1][1] : null;
  const avg_fx = fxSeries.length? Math.round((fxSeries.reduce(function(s,x){return s+x[1];},0)/fxSeries.length)*10)/10 : null;
  return {po_cum_final,in_cum_final,ship_cum_final,stock_final,fulfill_rate,ship_rate,buy_total,sell_total,profit_total,
    profit_rate_avg,ar_total,wire_total,ar_remain,collect_rate,shortage,latest_fx,avg_fx,
    first_date:firstDate, last_date:lastDate, lot_count:lotCount};
}

function parseWorkbookToRaw(wb){
  let sheetName = wb.SheetNames.find(function(n){ return n.indexOf('입출고')>=0 && n.indexOf('미수금')>=0; });
  if(!sheetName) sheetName = wb.SheetNames.find(function(n){ return n.indexOf('입출고')>=0; });
  if(!sheetName) sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});

  const collected = [];
  for(let i=3;i<grid.length;i++){
    const row = grid[i]||[];
    const isBlank = row.length===0 || row.every(function(v){ return v===null||v===undefined||v===''; });
    if(isBlank) continue;
    const obj = {};
    HPPK_COLS.forEach(function(key,idx){ obj[key]=row[idx]===undefined?null:row[idx]; });
    ['po_date','in_date','ship_date','load_date','wire_date'].forEach(function(k){ obj[k]=excelSerialToISO(obj[k]); });
    collected.push(obj);
  }
  if(collected.length<2) throw new Error('데이터 행을 찾을 수 없습니다 (시트 구조를 확인해 주세요)');
  const summary = collected[collected.length-1];
  const rows = collected.slice(0,-1);

  function series(dateKey, valKey){
    return rows.filter(function(r){ return r[dateKey] && r[valKey]!=null; })
      .map(function(r){ return [r[dateKey], r[valKey]]; })
      .sort(function(a,b){ return a[0]<b[0]?-1:1; });
  }
  const po_series = series('po_date','po_cum');
  const in_series = series('in_date','in_cum');
  const ship_series = series('ship_date','ship_cum');
  const stock_series = series('ship_date','stock_cum');
  const buy_series = series('ship_date','buy_cum');
  const sell_series = series('ship_date','sell_cum');
  const profit_series = series('ship_date','profit_cum');
  const fx_series = series('ship_date','fx_base');

  let arEvents = rows.filter(function(r){ return r.ship_date && r.ar_total_usd!=null; }).map(function(r){ return [r.ship_date,r.ar_total_usd]; });
  arEvents.sort(function(a,b){ return a[0]<b[0]?-1:1; });
  let c=0; const ar_cum = arEvents.map(function(e){ c+=e[1]; return [e[0],c]; });

  let wireEvents = rows.filter(function(r){ return r.wire_date && r.wire_amt!=null; }).map(function(r){ return [r.wire_date,r.wire_amt]; });
  wireEvents.sort(function(a,b){ return a[0]<b[0]?-1:1; });
  c=0; const wire_cum = wireEvents.map(function(e){ c+=e[1]; return [e[0],c]; });

  const yearly = buildYearlyJS(rows);
  const full_table = buildFullTableJS(rows);
  const shipDates = rows.filter(function(r){ return r.ship_date; }).map(function(r){ return r.ship_date; });
  const firstDate = shipDates.length? shipDates.reduce(function(a,b){ return a<b?a:b; }) : null;
  const lastDate = shipDates.length? shipDates.reduce(function(a,b){ return a>b?a:b; }) : null;
  const kpi = buildKPIJS(summary, fx_series, full_table.length, firstDate, lastDate);

  return {kpi, po_series, in_series, ship_series, stock_series, buy_series, sell_series, profit_series, fx_series, ar_cum, wire_cum, yearly, full_table};
}

let fileHandle = null;
let autoTimer = null;

function setLinkStatus(state, name){
  const el = document.getElementById('linkPill');
  if(!el) return;
  if(state==='connected'){
    const t = new Date().toLocaleTimeString('ko-KR',{hour12:false});
    el.textContent = '🔗 연동됨 · ' + (name||'') + ' · ' + t + ' 갱신';
    el.style.background = 'rgba(45,192,122,0.28)';
  } else if(state==='error'){
    el.textContent = '🔗 갱신 실패 · 클릭하여 재연결';
    el.style.background = 'rgba(255,77,109,0.28)';
  } else if(state==='loading'){
    el.textContent = '🔗 불러오는 중…';
  } else {
    el.textContent = '🔗 엑셀 미연동 · 클릭하여 연결';
    el.style.background = '';
  }
}

async function loadFromFile(file){
  setLinkStatus('loading');
  try{
    const buf = await file.arrayBuffer();
    if(typeof XLSX==='undefined'){ throw new Error('엑셀 파서(XLSX) 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); }
    const wb = XLSX.read(buf, {type:'array'});   // 날짜는 일련번호로 읽어 parse_date_code로 변환(시간대 밀림 방지)
    const newRaw = parseWorkbookToRaw(wb);
    RAW = newRaw; KPI = RAW.kpi; YEARLY = RAW.yearly; FULL = RAW.full_table;
    renderAll();
    setLinkStatus('connected', file.name);
  }catch(err){
    console.error('엑셀 읽기 실패', err);
    setLinkStatus('error');
    alert('엑셀 파일을 읽는 중 문제가 발생했습니다.\n' + err.message);
  }
}

async function refreshFromHandle(){
  if(!fileHandle) return;
  try{
    const file = await fileHandle.getFile();
    await loadFromFile(file);
  }catch(err){
    console.error('엑셀 새로고침 실패', err);
    setLinkStatus('error');
  }
}

function startAutoRefresh(){
  if(autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(refreshFromHandle, 20000);
}

async function connectExcel(){
  if('showOpenFilePicker' in window){
    try{
      const [handle] = await window.showOpenFilePicker({
        types:[{description:'Excel 파일', accept:{
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],
          'application/vnd.ms-excel.sheet.macroEnabled.12':['.xlsm']
        }}]
      });
      fileHandle = handle;
      await refreshFromHandle();
      startAutoRefresh();
    }catch(err){
      if(err && err.name==='AbortError') return;
      console.error('File System Access API 연동 실패, 파일 선택창으로 대체', err);
      document.getElementById('excelFileInput').click();
    }
  } else {
    document.getElementById('excelFileInput').click();
  }
}
document.getElementById('excelFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    fileHandle = null;
    if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
    loadFromFile(file);
  }
});

function skey(cat,sub){ return normTxt(cat)+'|'+normTxt(sub); }
function fileMeta(file){
  const m=file.match(/(\d{4}-\d{2}-\d{2})/); const date=m?m[1]:'';
  let title=file.replace(/\.[^.]+$/,'');
  if(m) title=title.replace(m[1],'').replace(/^[_\-\s]+/,'').trim()||file;
  return {date,title};
}
// [향후 확장 지점] 현재는 GitHub 업로드 페이지로 연결. 대시보드 직접 업로드 도입 시 이 함수만 교체.
function addUploadHref(cat,sub){
  return 'https://github.com/'+GH_OWNER+'/'+GH_REPO+'/upload/'+GH_BRANCH+'/'+encodeURI(SAFE_BASE+'/'+cat+'/'+sub);
}
async function loadSafeIndex(){
  const api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/trees/'+GH_BRANCH+'?recursive=1';
  const idx={};
  try{
    const res=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    (data.tree||[]).forEach(function(n){
      if(n.type!=='blob') return;
      const p=n.path||''; const parts=p.split('/');
      if(parts.length<4) return;                       // SAFE/항목/세부기능/파일 (최소 4단)
      if(parts[0].toUpperCase()!==SAFE_BASE.toUpperCase()) return;
      const file=parts[parts.length-1];
      if(!/\.(pdf|png|jpe?g|gif|webp|hwp|hwpx|docx?|xlsx?|pptx?|tiff?)$/i.test(file)) return;  // .gitkeep/README 등 무시
      const key=skey(parts[1],parts[2]);
      (idx[key]=idx[key]||[]).push({path:p,file:file});
    });
    SAFE_INDEX=idx;
  }catch(e){ console.warn('SAFE 자료 목록을 불러오지 못했습니다:', e&&e.message); SAFE_INDEX={}; }
  renderMain();
}
function filesPanelHTML(c, sub){
  const key=skey(c.name,sub);
  const loading=(SAFE_INDEX===null);
  const files=(SAFE_INDEX&&SAFE_INDEX[key])?SAFE_INDEX[key].slice():[];
  files.sort(function(a,b){
    const da=(a.file.match(/\d{4}-\d{2}-\d{2}/)||[''])[0], db=(b.file.match(/\d{4}-\d{2}-\d{2}/)||[''])[0];
    if(da!==db) return da<db?1:-1; return a.file<b.file?1:-1;
  });
  let cards;
  if(loading){
    cards='<div class="file-card"><div class="fi">⏳</div><div class="fn">불러오는 중…</div><div class="fs">GitHub 조회</div></div>';
  }else if(files.length){
    cards=files.map(function(f){ const meta=fileMeta(f.file);
      return '<a class="file-card doc" href="'+encodeURI(f.path)+'" target="_blank" rel="noopener" title="'+f.file.replace(/"/g,'')+'">'+
             '<div class="fi">📄</div><div class="fn">'+(meta.title||f.file)+'</div><div class="fs">'+(meta.date||'')+'</div></a>';
    }).join('');
  }else{
    cards='<div class="file-card"><div class="fi">🗂️</div><div class="fn">등록된 자료 없음</div><div class="fs">GitHub에 올리면 표시됩니다</div></div>';
  }
  const cnt=loading?'…':files.length;
  return `
      <div class="fp-head"><h3>${sub}</h3><span class="tag">등록된 자료 ${cnt}건</span>
        <a class="upload-btn" href="${addUploadHref(c.name,sub)}" target="_blank" rel="noopener">＋ GitHub에 자료 올리기</a></div>
      <p class="fp-desc">이 항목의 파일(PDF·이미지·문서 등)을 GitHub <b>${SAFE_BASE}/${c.name}/${sub}</b> 폴더에 올리면, 아래에 자동으로 나타나고 클릭하면 새 탭에서 열립니다.</p>
      <div class="file-grid">${cards}</div>
      <div class="empty-note">※ 지금은 <b>GitHub 업로드 방식</b>입니다. 위 <b>＋GitHub에 자료 올리기</b> 버튼을 누르면 해당 폴더의 업로드 화면으로 바로 이동합니다. <b>향후</b> 대시보드에서 직접 업로드하는 기능으로 교체할 수 있도록 설계되어 있습니다.</div>`;
}

/* 좌측 메뉴 렌더 */
function renderNav(){
  $('sbNav').innerHTML = CATS.map(c=>`
    <li class="sb-item ${c.key===activeKey?'active':''}" data-key="${c.key}">
      <span class="ic">${c.icon}</span><span>${c.name}</span><span class="cnt">${c.subs.length}</span>
    </li>`).join('');
  $('sbNav').querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click', ()=>{ activeKey = el.getAttribute('data-key'); activeSubIdx = 0; renderNav(); renderMain(); });
  });
}

/* 우측 본문 렌더 */
function renderMain(){
  const c = CATS.find(x=>x.key===activeKey);
  const sub = c.subs[activeSubIdx] || c.subs[0];
  $('content').innerHTML = `
    <div class="cat-head">
      <div class="big">${c.icon}</div>
      <div><h2>${c.name}</h2><p>세부 기능 ${c.subs.length}개 · 항목을 선택하면 자료를 조회합니다</p></div>
    </div>

    <div class="section-label"><span class="bar"></span>세부 기능</div>
    <div class="sub-grid" id="subGrid">
      ${c.subs.map((s,i)=>`
        <div class="sub-card ${i===activeSubIdx?'active':''}" data-idx="${i}">
          <div class="nm"><span class="num">${i+1}</span>${s}</div>
          <div class="meta">자료 조회 · 첨부파일</div>
        </div>`).join('')}
    </div>

    <div class="section-label"><span class="bar"></span>자료 · 첨부파일 <span style="font-weight:600;color:var(--text-tertiary);font-size:0.72rem;">— ${c.name} · ${sub}</span></div>
    <div class="files-panel">${filesPanelHTML(c, sub)}</div>
  `;
  $('subGrid').querySelectorAll('.sub-card').forEach(el=>{
    el.addEventListener('click', ()=>{ activeSubIdx = parseInt(el.getAttribute('data-idx'),10); renderMain(); });
  });
}

/* 라이트/다크 전환 */
$('themeBtn').addEventListener('click', ()=>{
  const dark = document.body.classList.toggle('dark');
  $('themeBtn').firstChild.nodeValue = dark ? '☀️ ' : '🌙 ';
  $('themeLabel').textContent = dark ? '라이트 모드' : '다크 모드';
});

renderNav();
renderMain();
loadSafeIndex();   // GitHub SAFE 폴더에서 자료 목록을 읽어 자동 표시

function themed(){ const lt=document.body.classList.contains('light');
  return {tick:lt?'#3A3F4D':'rgba(255,255,255,0.68)', grid:lt?'rgba(16,24,40,0.08)':'rgba(255,255,255,0.10)', legend:lt?'#2A2E3A':'rgba(255,255,255,0.82)'}; }

function renderCharts(){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={};
  if(typeof Chart==='undefined'){
    document.querySelectorAll('.chart-wrap').forEach(el=>el.innerHTML='<div class="chart-fallback">⚠ 차트 라이브러리를 불러오지 못했습니다.<br>인터넷 연결 후 새로고침하면 그래프가 표시됩니다.<br>(KPI·상세표는 정상 동작합니다)</div>');
    return;
  }
  const T=themed();
  Chart.defaults.font.family="Pretendard, sans-serif"; Chart.defaults.color=T.tick;
  const grid={color:T.grid}, tick={color:T.tick,font:{size:11}};

  // 1) 연도별 건수 + 확정요금
  const years=[...new Set(UPS.map(yearOf).filter(Boolean))].sort();
  const yc=years.map(y=>UPS.filter(r=>yearOf(r)===y).length);
  const yf=years.map(y=>UPS.filter(r=>yearOf(r)===y).reduce((s,r)=>s+won(r.feeFinal||r.feeSum),0));
  try{ charts.year=new Chart($('chYear'),{data:{labels:years.map(String),datasets:[
      {type:'bar',label:'발송 건수',data:yc,backgroundColor:'#4FBFB8',borderRadius:6,yAxisID:'y',maxBarThickness:46},
      {type:'line',label:'확정 특송비용',data:yf,borderColor:'#FFB84F',backgroundColor:'rgba(255,184,79,0.15)',tension:.35,fill:true,pointRadius:4,pointBackgroundColor:'#FFB84F',yAxisID:'y1'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:T.legend,usePointStyle:true,boxWidth:10,font:{size:11}}}},
      scales:{x:{grid:{display:false},ticks:tick},y:{position:'left',grid,ticks:{...tick,stepSize:1},title:{display:true,text:'건수',color:T.tick,font:{size:10}},beginAtZero:true},
      y1:{position:'right',grid:{display:false},ticks:{...tick,callback:v=>(v/10000).toFixed(0)+'만'},beginAtZero:true}}}}); }catch(e){console.error(e);}

  // 2) 국가별 건수 도넛
  const cc={}; UPS.forEach(r=>{const c=country(r.destName); cc[c]=(cc[c]||0)+1;});
  const ce=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  try{ charts.country=new Chart($('chCountry'),{type:'doughnut',data:{labels:ce.map(e=>flag(e[0])+' '+e[0]),datasets:[{data:ce.map(e=>e[1]),backgroundColor:PALETTE,borderColor:'#ffffff22',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{color:T.legend,font:{size:12},usePointStyle:true,boxWidth:12,padding:12}},tooltip:{callbacks:{label:c=>`${c.label}: ${c.parsed}건`}}}}}); }catch(e){console.error(e);}

  // 3) 국가별 확정요금 합계 (가로바)
  const cf={}; UPS.forEach(r=>{const c=country(r.destName); cf[c]=(cf[c]||0)+won(r.feeFinal||r.feeSum);});
  const fe=Object.entries(cf).sort((a,b)=>b[1]-a[1]);
  try{ charts.cfee=new Chart($('chCountryFee'),{type:'bar',data:{labels:fe.map(e=>flag(e[0])+' '+e[0]),datasets:[{data:fe.map(e=>e[1]),backgroundColor:'#1428A0',hoverBackgroundColor:'#2645B0',borderRadius:6,maxBarThickness:30}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtW(c.parsed.x)}}},scales:{x:{grid,ticks:{...tick,callback:v=>(v/10000).toFixed(0)+'만'}},y:{grid:{display:false},ticks:tick}}}}); }catch(e){console.error(e);}

  // 4) 발송 건별 확정요금 상위 8
  const top=UPS.map(r=>({l:label(r),v:won(r.feeFinal||r.feeSum)})).sort((a,b)=>b.v-a.v).slice(0,8);
  try{ charts.top=new Chart($('chTop'),{type:'bar',data:{labels:top.map(t=>t.l),datasets:[{data:top.map(t=>t.v),backgroundColor:['#1428A0','#2645B0','#4D67C3','#0EA5E9','#14B8A6','#0E9F6E','#F59E0B','#E8710A'],borderRadius:6,maxBarThickness:26}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtW(c.parsed.x)}}},scales:{x:{grid,ticks:{...tick,callback:v=>(v/10000).toFixed(0)+'만'}},y:{grid:{display:false},ticks:{...tick,font:{size:10}}}}}}); }catch(e){console.error(e);}
}

function renderTable(){
  const kw=($('q').value||'').trim().toLowerCase();
  const rows=UPS.filter(r=>!kw||[label(r),r.tracking,r.product,country(r.destName),r.sendDate].join(' ').toLowerCase().includes(kw));

}

   =================================================================== */
const GH_OWNER='kinof2018-create', GH_REPO='HP-IN-MH4', GH_BRANCH='main', ESG_BASE='ESG';
let ESG_INDEX=null;   // { '카테고리|세부항목'(정규화): [{path,file}] }
const DOC_CATS = {
  E:{folder:'E', label:'환경(E) 증빙', subs:['환경경영인증(ISO14001)','온실가스·에너지 인벤토리','폐기물·수처리 관리','화학물질·대기 관리','환경목표·저감활동']},
  S:{folder:'S', label:'사회(S) 증빙', subs:['취업규칙·근로계약','노사협의회','안전보건·위험성평가','건강검진·작업환경측정','품질인증(ISO9001)','공급망 관리']},
  G:{folder:'G', label:'지배구조(G) 증빙', subs:['윤리경영 지침','준법·내부심사','이사회·주주총회','ESG KPI·정보공개','하도급 공정계약']},

};
let docCatKey='E', docSubIdx=0;

function normTxt(s){ return String(s==null?'':s).replace(/\s+/g,'').toLowerCase(); }
function skey(cat,sub){ return normTxt(cat)+'|'+normTxt(sub); }
function fileMeta(file){
  const m=file.match(/(\d{4}-\d{2}-\d{2})/); const date=m?m[1]:'';
  let title=file.replace(/\.[^.]+$/,'');
  if(m) title=title.replace(m[1],'').replace(/^[_\-\s]+/,'').trim()||file;
  return {date,title};
}
function addUploadHref(folder,sub){
  return 'https://github.com/'+GH_OWNER+'/'+GH_REPO+'/upload/'+GH_BRANCH+'/'+encodeURI(ESG_BASE+'/'+folder+'/'+sub);
}
async function loadEsgIndex(){
  const api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/trees/'+GH_BRANCH+'?recursive=1';
  const idx={};
  try{
    const res=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    (data.tree||[]).forEach(function(n){
      if(n.type!=='blob') return;
      const p=n.path||''; const parts=p.split('/');
      if(parts.length<4) return;                          // ESG/카테고리/세부항목/파일
      if(parts[0].toUpperCase()!==ESG_BASE.toUpperCase()) return;
      const file=parts[parts.length-1];
      if(!/\.(pdf|png|jpe?g|gif|webp|hwp|hwpx|docx?|xlsx?|pptx?|tiff?)$/i.test(file)) return;
      const key=skey(parts[1],parts[2]);
      (idx[key]=idx[key]||[]).push({path:p,file:file});
    });
    ESG_INDEX=idx;
  }catch(e){ console.warn('ESG 자료 목록을 불러오지 못했습니다:', e&&e.message); ESG_INDEX={}; }
  if(activeKey==='docs') renderMain();
}
function docFilesHTML(){
  const cat=DOC_CATS[docCatKey]; const sub=cat.subs[docSubIdx]||cat.subs[0];
  const key=skey(cat.folder,sub);
  const loading=(ESG_INDEX===null);
  const files=(ESG_INDEX&&ESG_INDEX[key])?ESG_INDEX[key].slice():[];
  files.sort(function(a,b){
    const da=(a.file.match(/\d{4}-\d{2}-\d{2}/)||[''])[0], db=(b.file.match(/\d{4}-\d{2}-\d{2}/)||[''])[0];
    if(da!==db) return da<db?1:-1; return a.file<b.file?1:-1;
  });
  let cards;
  if(loading){
    cards='<div class="file-card"><div class="fi">⏳</div><div class="fn">불러오는 중…</div><div class="fs">GitHub 조회</div></div>';
  }else if(files.length){
    cards=files.map(function(f){ const meta=fileMeta(f.file);
      return '<a class="file-card doc" href="'+encodeURI(f.path)+'" target="_blank" rel="noopener" title="'+f.file.replace(/"/g,'')+'">'+
             '<div class="fi">📄</div><div class="fn">'+(meta.title||f.file)+'</div><div class="fs">'+(meta.date||'')+'</div></a>';
    }).join('');
  }else{
    cards='<div class="file-card"><div class="fi">🗂️</div><div class="fn">등록된 자료 없음</div><div class="fs">GitHub에 올리면 표시됩니다</div></div>';
  }
  const subChips=cat.subs.map((s,i)=>`<span class="ss ${i===docSubIdx?'active':''}" data-sub="${i}">${s}</span>`).join('');
  const catChips=Object.keys(DOC_CATS).map(k=>`<span class="ss ${k===docCatKey?'active':''}" data-cat="${k}">${DOC_CATS[k].label}</span>`).join('');
  const cnt=loading?'…':files.length;
  return `
    <div class="subsel" id="docCatSel">${catChips}</div>
    <div class="fp-head"><h3>${cat.label} · ${sub}</h3><span class="tag">등록된 자료 ${cnt}건</span>
      <a class="upload-btn" href="${addUploadHref(cat.folder,sub)}" target="_blank" rel="noopener">＋ GitHub에 자료 올리기</a></div>
    <div class="subsel" id="docSubSel">${subChips}</div>
    <p class="fp-desc">이 항목의 증빙(PDF·이미지·문서 등)을 GitHub <b>${ESG_BASE}/${cat.folder}/${sub}</b> 폴더에 올리면, 아래에 자동으로 나타나고 클릭하면 새 탭에서 열립니다.</p>
    <div class="file-grid">${cards}</div>
    <div class="empty-note">※ 지금은 <b>GitHub 업로드 방식</b>입니다. 위 <b>＋GitHub에 자료 올리기</b> 버튼을 누르면 해당 폴더의 업로드 화면으로 바로 이동합니다. 폴더 규칙은 <b>${ESG_BASE}/[E·S·G·공통]/[세부항목]/[연도]_[제목].확장자</b> 입니다. <b>향후</b> 대시보드에서 직접 업로드하는 기능으로 교체할 수 있도록 설계되어 있습니다.</div>`;
}

function themed(){
  const dark=document.body.classList.contains('dark');
  return {grid:dark?'rgba(255,255,255,0.1)':'rgba(16,24,40,0.08)',
          tick:dark?'rgba(255,255,255,0.72)':'#5A5F6E',
          legend:dark?'rgba(255,255,255,0.85)':'#2A2E3A'};
}
function destroyCharts(){ Object.keys(charts).forEach(k=>{ if(charts[k]){charts[k].destroy(); delete charts[k];} }); }
function hasChart(){ return typeof Chart !== 'undefined'; }

/* ===== 본문 렌더 ===== */
function renderMain(){
  destroyCharts();
  if(activeKey==='summary') return renderSummary();
  if(activeKey==='grade')   return renderGrade();
  if(activeKey==='tasks')   return renderTasks();
  if(activeKey==='opinion') return renderOpinion();
  if(activeKey==='docs')    return renderDocs();
  return renderDomain(activeKey);   // E / S / G
}

function gradeColor(g){ return ['#0E9F5E','#3FA9F5','#E0A32E','#EF8A3C','#D64545'][g-1]||'#888'; }
function kpiTrend(delta){
  if(delta===0) return `<div class="ks flat">— 전년 대비 변동 없음</div>`;
  const up=delta>0; const good = !up; // 배출/원단위는 감소가 좋음
  return `<div class="ks ${up?'up':'down'}">${up?'▲':'▼'} 전년 대비 ${Math.abs(delta)}%</div>`;
}

function renderDomainFiles(k){
  const cat=DOC_CATS[k]; docSubIdx=Math.min(docSubIdx,cat.subs.length-1);
  const sub=cat.subs[docSubIdx]||cat.subs[0];
  const key=skey(cat.folder,sub);
  const loading=(ESG_INDEX===null);
  const files=(ESG_INDEX&&ESG_INDEX[key])?ESG_INDEX[key].slice():[];
  files.sort((a,b)=>a.file<b.file?1:-1);
  let cards;
  if(loading){ cards='<div class="file-card"><div class="fi">⏳</div><div class="fn">불러오는 중…</div><div class="fs">GitHub 조회</div></div>'; }
  else if(files.length){ cards=files.map(f=>{const m=fileMeta(f.file);
    return '<a class="file-card doc" href="'+encodeURI(f.path)+'" target="_blank" rel="noopener"><div class="fi">📄</div><div class="fn">'+(m.title||f.file)+'</div><div class="fs">'+(m.date||'')+'</div></a>';}).join(''); }
  else{ cards='<div class="file-card"><div class="fi">🗂️</div><div class="fn">등록된 자료 없음</div><div class="fs">GitHub에 올리면 표시됩니다</div></div>'; }
  const subChips=cat.subs.map((s,i)=>`<span class="ss ${i===docSubIdx?'active':''}" data-sub="${i}">${s}</span>`).join('');
  const cnt=loading?'…':files.length;
